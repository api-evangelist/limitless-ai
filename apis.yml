name: Limitless
kind: company
description: Limitless is a personalized AI for meetings with a software assistant and the Limitless Pendant
  wearable that captures conversations as Lifelogs. The Limitless Developer API gives users programmatic
  access to their own Lifelogs, Ask AI chat history, and audio downloads, with an MCP endpoint that lets
  Claude and other MCP-compatible tools query Limitless memory directly. The OpenAPI spec is published
  and example code is hosted on GitHub.
